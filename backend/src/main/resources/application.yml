server:
  port: 8080

spring:
  application:
    name: stocksense-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/stocksense
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5970}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}
