spring:
  application:
    name: stocksense-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/stocksense
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080